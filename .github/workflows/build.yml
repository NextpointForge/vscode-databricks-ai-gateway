name: Build VSIX

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: aigw-models.vsix
          path: aigw-models.vsix
